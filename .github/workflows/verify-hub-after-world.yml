name: Verify Hub UI after World integration

on:
  push:
    branches:
      - verify/hub-merge-base
  pull_request:

jobs:
  verify-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Targeted Hub/overlay regression
        run: >-
          npx vitest run
          src/layered-home-ui.test.ts
          src/LayeredHome.test.tsx
          src/App.test.tsx
          src/home-panels.test.ts
          src/seasonal-home.test.ts
          src/world-ui.test.ts
          src/world-integration-wiring.test.ts
      - name: Full test
        run: npm run test
      - name: TypeScript
        run: npx tsc -b --pretty false
      - name: Production build
        run: npm run build
