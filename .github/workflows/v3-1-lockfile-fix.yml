name: V3.1 lockfile fix

on:
  push:
    branches:
      - work/v3-1-production-hardening
    paths:
      - .github/workflows/v3-1-lockfile-fix.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/v3-1-production-hardening
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Update nanoid transitively
        run: npm update nanoid --package-lock-only --ignore-scripts
      - name: Verify advisory is gone
        run: npm audit --audit-level=high
      - name: Commit lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m "chore: update nanoid to patched transitive version"
          git push origin HEAD:work/v3-1-production-hardening
