name: CI
on:
  pull_request:
  push:
    branches: [main, feat/v2-core-growth]
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Clean install
        run: npm ci
      - name: Dependency audit evidence
        run: npm audit --json || true
      - run: npm run test
      - run: npm run build
