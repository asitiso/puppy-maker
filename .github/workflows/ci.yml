name: CI
on:
  pull_request:
  push:
    branches: [main, feat/v2-core-growth]
permissions:
  contents: write
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply verify-only core compatibility recovery
        if: github.head_ref == 'verify/core-compat-recovery'
        run: python3 .github/verify-core-recovery.py
      - name: Align growth report fixture with strict base contract
        if: github.head_ref == 'verify/core-compat-recovery'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/GrowthReport.test.tsx')
          text = path.read_text()
          old = "const report:Report={quality:'PERFECT',grade:'S',mostImprovedStat:'magic',masteryGains:{hunt:0,magic:3,rest:0,herb:0},personalityChanges:{curiosity:2},newMemory:'first_perfect',nextCondition:'focused',goldReward:350};"
          new = "const report:Report={quality:'PERFECT',grade:'S',topStat:{key:'magic',delta:3},masteryLevels:{hunt:1,magic:2,rest:1,herb:1},personalityDeltas:{curiosity:2},newMemories:['first_perfect'],randomEvent:null,unlockedSkill:null,mostImprovedStat:'magic',masteryGains:{hunt:0,magic:3,rest:0,herb:0},personalityChanges:{curiosity:2},newMemory:'first_perfect',nextCondition:'focused',goldReward:350};"
          if old in text:
              assert text.count(old) == 1
              path.write_text(text.replace(old, new, 1))
          else:
              assert new in text
          PY
      - name: Limit verify changes
        if: github.head_ref == 'verify/core-compat-recovery'
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            src/attendance-progression.test.ts \
            src/calling-depth-progression.test.ts \
            src/career-progression.test.ts \
            src/components/GrowthReport.test.tsx \
            src/expedition-progression.test.ts \
            src/exploration-progression.test.ts \
            src/game-base.ts \
            src/game-core.ts \
            src/game.test.ts \
            src/game.ts \
            src/guardian-rank-progression.test.ts \
            src/mail-reward-progression.test.ts \
            src/monthly-progression.test.ts \
            src/progression.test.ts \
            src/story-progression.test.ts | sort)"
          if [ -n "$changed" ]; then
            test "$changed" = "$expected"
          fi
      - run: npm install
      - name: Targeted core, save, and shared-adapter tests
        if: github.head_ref == 'verify/core-compat-recovery'
        run: >-
          npx vitest run
          src/core-compat-recovery.test.ts
          src/game.test.ts
          src/save-schema.test.ts
          src/save-resilience.test.ts
          src/components/GrowthReport.test.tsx
          src/guardian-rank-progression.test.ts
          src/story-progression.test.ts
          src/career-progression.test.ts
          src/monthly-progression.test.ts
          src/attendance-progression.test.ts
          src/mail-reward-progression.test.ts
          src/expedition-progression.test.ts
          src/exploration-progression.test.ts
          src/calling-depth-progression.test.ts
          src/progression.test.ts
      - name: Full test suite
        run: npm run test
      - name: TypeScript project check
        run: npx tsc -b --pretty false
      - name: Production build
        run: npm run build
      - name: Commit verified recovery to verify branch
        if: github.head_ref == 'verify/core-compat-recovery'
        run: |
          if git diff --quiet -- src; then
            echo "Verified recovery already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: restore core public API compatibility"
          git push origin HEAD:verify/core-compat-recovery
